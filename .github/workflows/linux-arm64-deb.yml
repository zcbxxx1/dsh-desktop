name: Linux arm64 deb

# Produces an unsigned, installable aarch64 Debian package for DeepSeek Harness
# Desktop. The upstream project only ships macOS and Windows packaging entry
# points, so this workflow adds the Linux arm64 target without touching the
# signed release flows.
#
# Why a native arm64 runner: `dsh-plugin-desktop/scripts/prepare-fs-ext.ts`
# compiles the `fs-ext` native binding against Electron headers and explicitly
# refuses cross-platform compilation ("fs-ext must be compiled on the target
# platform"). Electron Builder then packages the resulting
# `node_modules/fs-ext/prebuilds/linux-arm64/electron.abi<ABI>.node`, which the
# `afterPack` runtime verifier requires for Linux arm64.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the .deb as a GitHub Release asset
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - '.github/workflows/linux-arm64-deb.yml'
      - 'dsh-plugin-desktop/**'
      - 'dsh-community-market/**'
      - 'yarn.lock'
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: linux-arm64-deb-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  DEB_TAG: linux-arm64-deb

jobs:
  linux-arm64-deb:
    name: Build aarch64 .deb
    # GitHub-hosted arm64 runner. Native arm64 is mandatory here; an x64 runner
    # cannot produce a valid arm64 fs-ext binding.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Confirm runner architecture
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = "aarch64" || {
            echo "::error::This job requires an aarch64 runner; got $(uname -m)"
            exit 1
          }

      - uses: actions/checkout@v6
        with:
          # The deepseek-harness submodule is not needed: the pinned dsh runtime
          # already ships as tarballs under vendor/dsh-runtime/<version>/ and the
          # workspace manifests point at those files.
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2

      - name: Enable Corepack
        run: corepack enable

      - name: Ensure Electron runtime libraries
        # The `afterPack` hook executes the packaged Electron binary five times
        # with ELECTRON_RUN_AS_NODE=1 (DSH CLI --version, pnpm --version, the
        # packaged runtime smoke, and two desktop-cli probes). The dynamic loader
        # must resolve Electron's shared libraries or the build fails partway
        # through packaging. Names differ across Ubuntu releases (24.04 renamed
        # several to *t64), so only install what this image actually offers.
        #
        # `apt-cache show` is not sufficient for that probe: on 24.04
        # `libasound2` still resolves as a package name but is a pure virtual
        # package whose only providers are `libasound2t64` and an OSS variant,
        # so `apt-get install libasound2` fails with "no installation candidate".
        # Requiring a non-`(none)` Candidate filters virtual packages out.
        run: |
          set -euo pipefail
          sudo apt-get update -qq || true
          candidates="libnss3 libnspr4 libatk1.0-0t64 libatk1.0-0 \
          libatk-bridge2.0-0t64 libatk-bridge2.0-0 libcups2t64 libcups2 \
          libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
          libxrandr2 libgbm1 libasound2t64 libasound2 libpango-1.0-0 \
          libcairo2 libgtk-3-0t64 libgtk-3-0 libglib2.0-0t64 libglib2.0-0 \
          libexpat1 libdbus-1-3 libxtst6 libxss1 libsecret-1-0 libnotify4 \
          xdg-utils fakeroot patchelf"
          available=""
          skipped=""
          for pkg in $candidates; do
            candidate=$(apt-cache policy "$pkg" 2>/dev/null \
              | awk '/^ *Candidate:/{print $2; exit}')
            if [ -n "$candidate" ] && [ "$candidate" != "(none)" ]; then
              available="$available $pkg"
            else
              skipped="$skipped $pkg"
            fi
          done
          echo "installing:$available"
          echo "skipped (virtual or absent):$skipped"
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $available

      - name: Confirm packaging tools
        # `patchelf` is not part of the runner image but the `afterPack` hook
        # uses it to point the packaged binary at the bundled loader.
        run: |
          set -euo pipefail
          patchelf --version
          tar --version | head -n1

      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ runner.arch }}-

      - name: Install workspace dependencies
        run: yarn install --immutable

      - name: Build the community market
        run: yarn workspace dsh-community-market build

      - name: Build the desktop workspace
        run: yarn workspace dsh-plugin-desktop build

      - name: Package the arm64 Debian artifact
        run: yarn workspace dsh-plugin-desktop dist:linux-deb

      - name: Inspect the produced package
        run: |
          set -euo pipefail
          ls -lh dsh-plugin-desktop/dist/*.deb
          deb="$(ls dsh-plugin-desktop/dist/*.deb | head -n1)"
          dpkg-deb --info "$deb"

          unpacked="$(mktemp -d)"
          dpkg-deb -x "$deb" "$unpacked"

          app="$unpacked/opt/DSH Desktop"
          echo "== bundled runtime =="
          libs="$(find "$app/lib" -maxdepth 1 -name '*.so*' | wc -l)"
          echo "libraries: $libs"
          test "$libs" -ge 200 || { echo "::error::bundled runtime looks incomplete ($libs entries)"; exit 1; }
          for required in ld-linux-aarch64.so.1 libc.so.6 libgtk-3.so.0 libglib-2.0.so.0; do
            test -e "$app/lib/$required" || { echo "::error::missing bundled $required"; exit 1; }
          done

          echo "== interpreter =="
          interpreter="$(patchelf --print-interpreter "$app/dsh-desktop")"
          echo "$interpreter"
          test "$interpreter" = "/opt/DSH Desktop/lib/ld-linux-aarch64.so.1" \
            || { echo "::error::unexpected interpreter: $interpreter"; exit 1; }

          echo "== launcher =="
          test -x "$app/dsh-desktop-launch" || { echo "::error::launcher missing or not executable"; exit 1; }

          echo "== desktop entry and icons =="
          cat "$unpacked/usr/share/applications/dsh-desktop.desktop"
          sizes="$(find "$unpacked/usr/share/icons" -name 'dsh-desktop.png' | wc -l)"
          echo "icon sizes: $sizes"
          test "$sizes" -ge 5 || { echo "::error::expected a multi-size icon set, found $sizes"; exit 1; }

          echo "== postinst routes the desktop entry through the launcher =="
          dpkg-deb --ctrl-tarfile "$deb" | tar -xO ./postinst | grep -q 'dsh-desktop-launch' \
            || { echo "::error::postinst does not reference the launcher"; exit 1; }

          rm -rf "$unpacked"
          echo "sha256:"; sha256sum "$deb" | tee dsh-plugin-desktop/dist/SHA256SUMS-linux-arm64.txt

      - name: Upload the .deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: dsh-desktop-linux-arm64-deb
          path: |
            dsh-plugin-desktop/dist/*.deb
            dsh-plugin-desktop/dist/SHA256SUMS-linux-arm64.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish the .deb as a release asset
        # release/push events always publish; a manual dispatch honours the input.
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-$DEB_TAG}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "DSH Desktop - Linux arm64 (.deb)" \
              --notes "Unsigned aarch64 Debian package built from ${GITHUB_SHA}. Install with: sudo apt install ./dsh-desktop_*_arm64.deb -- Community build of DeepSeek Harness Desktop, not affiliated with DeepSeek AI." \
              --prerelease
          fi
          gh release upload "$tag" dsh-plugin-desktop/dist/*.deb dsh-plugin-desktop/dist/SHA256SUMS-linux-arm64.txt --clobber
          echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag"
